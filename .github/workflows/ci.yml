name: Project validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DEMO_MODE: 'true'
      APP_URL: http://localhost:3100
      BACKEND_URL: http://127.0.0.1:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm run build && npm test && npm run test:mongo
        working-directory: backend
      - run: npm run build && npm run typecheck && npm run lint
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: backend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: node scripts/scan-secrets.mjs
      - name: Verify latest frontend against isolated MongoDB and Express
        run: npm run test:frontend
        working-directory: backend
      - name: Verify backend independently and through frontend proxy
        run: |
          # Start each service in its own process group.  The API launcher owns
          # worker children, so a group stop prevents a prior test run from
          # retaining the demo data store or the API port.
          setsid bash -c 'cd backend && npm start' > /tmp/skillonit-api.log 2>&1 &
          API_PID=$!
          setsid bash -c 'cd frontend && npm start' > /tmp/skillonit-ui.log 2>&1 &
          UI_PID=$!
          trap 'kill -- -"$API_PID" -"$UI_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3100/api/v1/health > /dev/null; then break; fi
            sleep 2
          done
          cd backend
          TEST_ORIGIN=http://localhost:3100 npm run test:integration
          kill -- -"$API_PID"
          wait "$API_PID" || true
          rm -rf .data
          setsid npm start > /tmp/skillonit-api.log 2>&1 &
          API_PID=$!
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:4000/api/v1/health > /dev/null; then break; fi
            sleep 2
          done
          TEST_URL=http://localhost:3100 TEST_ORIGIN=http://localhost:3100 npm run test:integration
          npm run test:architecture
